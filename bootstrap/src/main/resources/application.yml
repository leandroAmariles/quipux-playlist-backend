spring:
  application:
    name: playlist-api
  r2dbc:
    url: r2dbc:h2:mem:///playlists?options=DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always

server:
  port: 8080
playlist:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:30m}
    demo-users:
      user-password: ${DEMO_USER_PASSWORD:}
      admin-password: ${DEMO_ADMIN_PASSWORD:}
