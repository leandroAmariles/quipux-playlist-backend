spring:
  application:
    name: playlist-api
  r2dbc:
    url: r2dbc:h2:mem:///playlists?options=DB_CLOSE_DELAY=-1
    username: sa
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
  ai:
    # Every model type of the starter is off by default: any of them left on requires an API key to start.
    model:
      chat: ${AI_PROVIDER:none}
      embedding: ${AI_PROVIDER:none}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL:http://localhost:4000/v1}
      api-key: ${AI_API_KEY:}
      max-retries: 0
      timeout: ${playlist.ai.timeout}
      chat:
        model: ${playlist.ai.chat-model}
        # The format of the answer goes in every request: its schema depends on the candidates.
        max-tokens: ${playlist.ai.max-output-tokens}
      embedding:
        model: ${playlist.ai.embedding-model}
        # What is compared is the text of a song alone.
        metadata-mode: none
        timeout: ${AI_EMBEDDING_TIMEOUT:5s}

server:
  port: 8080

logging:
  level:
    # It records the error body of the gateway, which may repeat the prompt.
    org.springframework.ai.chat.model.MessageAggregator: "off"

springdoc:
  default-produces-media-type: application/json

playlist:
  openapi:
    version: "@project.version@"
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:30m}
    demo-users:
      user-password: ${DEMO_USER_PASSWORD:}
      admin-password: ${DEMO_ADMIN_PASSWORD:}
  spotify:
    accounts-base-url: ${SPOTIFY_ACCOUNTS_BASE_URL:https://accounts.spotify.com}
    api-base-url: ${SPOTIFY_API_BASE_URL:https://api.spotify.com}
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    timeout: ${SPOTIFY_TIMEOUT:3s}
  genres:
    local-file: classpath:local-genres.properties
    cache:
      enabled: ${GENRES_CACHE_ENABLED:true}
      key: ${GENRES_CACHE_KEY:playlist:genres:spotify}
      ttl: ${GENRES_CACHE_TTL:24h}
      timeout: ${GENRES_CACHE_TIMEOUT:1s}
  ai:
    default-recommendations-file: classpath:default-recommendations.properties
    timeout: ${AI_TIMEOUT:30s}
    chat-model: ${AI_CHAT_MODEL:recomendador-chat}
    embedding-model: ${AI_EMBEDDING_MODEL:recomendador-embeddings}
    prompt-version: v2
    max-songs: 50
    max-field-length: 100
    max-output-tokens: 600
    max-concurrent-calls: 2
    requests-per-minute: 10
    cache:
      ttl: 24h
      max-entries: 500
    circuit-breaker:
      window: 10
      minimum-calls: 5
      failure-rate: 50
      open-duration: 30s
  # The songs that can be recommended and their database, used only while the AI is enabled.
  catalog:
    file: classpath:catalog/songs.json
    jdbc-url: ${CATALOG_DB_URL:}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD:}
    candidates: 20
    retrieval-timeout: ${CATALOG_RETRIEVAL_TIMEOUT:5s}
    index-batch-size: 50
    pool:
      max-size: 4
      connection-timeout: 2s
      socket-timeout: 4s
      query-timeout: 3s

management:
  health:
    # The database of the catalog is never part of the health of the application.
    db:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
